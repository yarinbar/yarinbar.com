apiVersion: apps/v1
kind: Deployment
metadata:
  name: yarinbar-website
  namespace: yarinbar
  labels:
    app: yarinbar-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yarinbar-website
  template:
    metadata:
      labels:
        app: yarinbar-website
    spec:
      containers:
        - name: website
          image: ghcr.io/yarinbar/yarinbar.com:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
